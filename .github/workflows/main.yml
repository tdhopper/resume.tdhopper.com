name: Build printable résumé
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://tdhopper/pandoc-context:latest
        with:
          args: -c make
      - run: |
          mv output/resume.html output/index.html
          mv output/resume.pdf output/tim-hopper-resume.pdf
          test -s output/index.html
          test -s output/tim-hopper-resume.pdf
          test -s output/resume.docx
          test -s output/resume.rtf
          grep -F 'Indianapolis area, IN, USA' output/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: resume-static
          path: |
            output/index.html
            output/tim-hopper-resume.pdf
            output/resume.docx
            output/resume.rtf
          if-no-files-found: error
          retention-days: 1
